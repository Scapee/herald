services:
  postgres:
    build:
      context: ..
      dockerfile: compose/Dockerfile.postgres
    container_name: herald-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-herald}
      POSTGRES_USER: ${POSTGRES_USER:-herald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-herald}
    volumes:
      - herald-postgres:/var/lib/postgresql/data
      - /opt/herald/cmd/migrate/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./init-migrations.sh:/docker-entrypoint-initdb.d/00-init-migrations.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-herald}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - herald

volumes:
  herald-postgres:

networks:
  herald:
    name: herald
    driver: bridge
